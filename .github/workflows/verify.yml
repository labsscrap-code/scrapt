name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: tests, lint, build, integrity and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout complete provenance history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            neural-frontier/package-lock.json
      - name: Install root locked dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated HUD locked dependencies
        run: npm ci --prefix neural-frontier --ignore-scripts --include=dev
      - name: Verify secrets, provenance, syntax, tests and build
        run: npm run verify
